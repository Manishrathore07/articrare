{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Articrare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="auth-body">

  <header class="navbar">
    <div class="nav-container">
      <a href="{% url 'index' %}" class="brand" style="text-decoration: none;">
        <span class="logo-icon">✦</span>
        <span class="logo-text">Articrare</span>
      </a>
      <div class="nav-actions">
        <span class="text-muted" style="font-size:0.9rem;">New to Articrare?</span>
        <a href="{% url 'register' %}" class="btn btn-primary">Sign Up Free</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">✦</div>
        <h1>Welcome back, artist</h1>
        <p class="text-muted">Login to upload sketches and track your critique scores</p>
      </div>

      {% if error %}
        <div class="alert-error">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="{{ username|default:'' }}"
                 placeholder="Your artist username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="Your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Login to Articrare →
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="{% url 'register' %}" class="link-accent">Sign up free</a>
      </p>
    </div>
  </main>

</body>
</html>
